spring:
  # ✅ 1. PostgreSQL 연결 설정
  datasource:
    url: jdbc:postgresql://localhost:5432/crates
    username: ${POSTGRESQL_USERNAME}
    password: ${POSTGRESQL_PASSWORD}
    driver-class-name: org.postgresql.Driver
    # 커넥션 풀. 앱이 DB와 동시에 열어두는 연결 수이고, DB에 동시에 쿼리를 던질 수 있는 상한이다.
    # 다 빌려 가면 다음 요청은 풀 앞에서 기다린다(hikaricp.connections.pending, acquire p95로 보인다).
    #
    # 기본값과 같은 10이지만 명시한다. 부하 측정 결과가 "풀 10"에서 나온 것임을 여기서 확인할 수 있고,
    # 바꿀 때 고칠 곳이 분명해진다. 크게 잡는다고 빨라지지 않는다 — DB가 실제로 동시에 처리하는 쿼리는
    # 코어 수 정도라 넘치는 연결은 문맥 전환과 락 경합만 늘린다(HikariCP 권장 출발점: 코어×2 + 디스크 수).
    #
    # minimum-idle을 같은 값으로 둬서 고정 크기로 쓴다. 부하가 몰리는 순간 연결을 새로 맺느라
    # 지연이 튀지 않게 하는 HikariCP 권장 방식이다.
    hikari:
      maximum-pool-size: 10
      minimum-idle: 10
  jpa:
    # 영속성 컨텍스트를 요청 전체가 아니라 트랜잭션 동안만 연다. 켜 두면(기본값) 컨트롤러에서 처음 DB를 쓴 순간부터
    # 응답이 끝날 때까지 커넥션을 쥐어, Qdrant·AI 서버를 기다리는 요청이 커넥션 풀(10개)을 다 차지한다.
    # 2026-10-04 부하 측정: 추천 50/s에서 Qdrant가 막히자 풀 대기가 189까지 쌓여 Qdrant를 쓰지 않는 API까지 기다렸다.
    # 끄면 컨트롤러·응답 단계에서 지연 로딩을 할 수 없다. 서비스가 트랜잭션 안에서 DTO로 바꿔 돌려주므로 해당 없다.
    open-in-view: false
    # 스키마는 Flyway(V1~V4, V8)가 갖는다. Hibernate는 테이블을 만들지도 지우지도 않는다.
    #
    # 엔티티를 바꿨을 때: 아래 명령으로 DDL을 다시 뽑아 차이를 보고 해당 기능의 마이그레이션을 고친다(개발 단계).
    #   ./gradlew bootRun --args="--spring.jpa.properties.jakarta.persistence.schema-generation.scripts.action=create \
    #                             --spring.jpa.properties.jakarta.persistence.schema-generation.scripts.create-target=schema.sql"
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true  # 콘솔에 쿼리 출력 여부
  # ✅ Flyway: 기능별 스키마(V1 콘텐츠, V2 사용자, V3 보드, V4 로그) -> 콘텐츠 데이터(V5~V7) -> 제목 검색 인덱스(V8)
  # -> 가입 취향 후보 데이터(V9). 구성과 규칙은 V1__ContentSchema.sql 머리말에 있다. 개발 단계라 만들었다 지우는 식으로
  # 쌓지 않고 기능별 파일을 최종 모양으로 고친다(2026-09-26, 2026-10-01 정리). 항상 빈 DB에서 시작한다(docker compose down -v).
  #
  # 예전에는 프로파일을 둘로 나눠 앱을 두 번 띄워야 했다. Spring Boot가 Flyway를
  # EntityManagerFactory보다 먼저 실행하는데 ddl-auto:create가 그 뒤에 테이블을 갈아엎어서,
  # [Flyway 시딩] -> [데이터 소멸] 순서가 됐기 때문이다. Flyway가 스키마를 갖게 되면서
  # ddl-auto를 끌 수 있었고 그 우회로가 사라졌다. 이제 기동 한 번으로 끝난다.
  #
  # baseline 설정이 없는 것은 의도다. 항상 빈 DB에서 시작하므로(docker compose down -v)
  # baseline이 필요 없다. baseline을 두면 그 버전 이하의 마이그레이션이 건너뛰어진다.
  flyway:
    enabled: true
  # ✅ 2. Redis (추천 보드 캐싱용)
  data:
    redis:
      host: localhost
      port: 6379
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: http://localhost:8080/login/oauth2/code/kakao
          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: http://localhost:8080/login/oauth2/code/naver
        provider:
          # 구글은 스프링이 기본 설정을 제공하지만, 카카오/네이버는 한국 서비스라 아래처럼 제공자 설정을 수동으로 채워줘야 합니다.
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response



# reids, elasticSearch 아직 docker에 없어서 발생하는 에러 생략
management:
  # 기본값은 health만 열려 있어서 metrics를 명시해야 crates.user.vector.* 를 읽을 수 있다.
  # SecurityConfig가 anyRequest().authenticated()라 actuator도 JWT가 필요하다.
  # 외부에 열 때는 별도 포트나 인가 규칙을 먼저 정할 것.
  endpoints:
    web:
      exposure:
        include: health, metrics, prometheus
  # Timer는 기본적으로 count/total/max만 보관한다. 꼬리 지연을 보려면 명시해야 한다.
  # 평균은 병목을 숨긴다 — 평균 5ms에 p99가 400ms인 일이 흔하다.
  #
  # 지표 이름에 점이 들어 있어 반드시 대괄호로 감싸야 한다. 그냥 쓰면 YAML이 중첩 키로
  # 해석해서 설정이 조용히 무시된다(에러가 아니라 무시라 알아채기 어렵다).
  #
  # percentiles는 이 인스턴스 안에서 계산된 값이다. 인스턴스가 여러 개가 되면 각자의 p95를
  # 평균 내는 것이 의미가 없어지므로, 그때는 percentiles-histogram으로 버킷을 내보내고
  # Prometheus가 histogram_quantile()로 합쳐야 한다.
  metrics:
    distribution:
      percentiles:
        "[http.server.requests]": 0.5, 0.95, 0.99          # 사용자가 겪는 응답 시간
        "[crates.user.vector.recalculation]": 0.5, 0.95, 0.99  # 취향 벡터 재계산
        "[hikaricp.connections.acquire]": 0.5, 0.95, 0.99  # 커넥션 획득 대기. 풀 포화의 선행 신호다
  # /actuator/health/liveness, /actuator/health/readiness를 연다. 로드 밸런서(ALB) 헬스 체크는 readiness를 본다.
  # 전체 /actuator/health는 Redis·DB 상태까지 합치는데, Redis는 캐시일 뿐이라(없으면 계산해서 응답한다)
  # Redis가 죽었다고 backend를 비정상으로 보고 교체하면 오히려 장애가 커진다.
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      enabled: true
    elasticsearch:
      enabled: false


# 즉석에서 만드는 보드(홈 추천 보드, 검색 보드) 한 장에 담을 콘텐츠 종류별 개수(BoardContentMix). 합이 보드 크기(8)여야 한다.
# 콘텐츠 벡터가 종류별로 모여 있어 그냥 가까운 순으로 8개를 고르면 한 종류만 나오기 쉬워, 종류마다 따로 뽑는다.
# 보드 안에서는 종류가 번갈아 오도록 놓는다(책 → 음악 → 책 → 영화 …).
board-mix:
  book: 4
  music: 2
  movie: 2

# ✅ 4. Qdrant 연결 설정 (커스텀 설정)
ai:
  vectorstore:
    qdrant:
      host: localhost
      port: 6333
      grpc-port: 6334
      api-key: "" # 로컬 도커는 인증이 없으므로 빈 문자열
      content-collection-name: content_vector
      query-collection-name: query_vector
      # 추천·검색 보드 제목은 콘텐츠 평균 벡터와 가장 가까운 query다(BoardTitleService). 대신 쓸 고정 제목은 없다.
      # AI 개발자가 만든 query 벡터 CSV를 기동 시 query_vector에 적재한다(QueryVectorLoader).
      # 파일은 카테고리별 셋이지만 모두 한 컬렉션에 넣는다. 제목은 한국어(query_ko), 같은 영어 문장은 한 번만 넣는다.
      # 이미 같은 수·같은 model_version으로 적재돼 있으면 건너뛴다. recreate: true면 지우고 다시 넣는다.
      query-load:
        enabled: true
        batch-size: 256
        recreate: false
        files:
          book: classpath:data/book_query_vectors.csv
          movie: classpath:data/movie_query_vectors.csv
          music: classpath:data/music_query_vectors.csv
      # AI 서버가 만든 콘텐츠 벡터 CSV를 기동 시 content_vector에 적재한다(ContentVectorLoader).
      # 이미 같은 수·같은 model_version으로 적재돼 있으면 건너뛰므로 매 기동마다 다시 넣지 않는다.
      load:
        enabled: true
        batch-size: 256
        # true면 이미 적재돼 있어도 지우고 다시 넣는다. content 수는 같은데 id 순서가 바뀌는
        # 재시딩(시딩 SQL 수정 등)은 자동 판단으로 잡히지 않으므로 그때 한 번 켠다.
        recreate: false
        # V5~V7 시딩도 이 파일의 id로 "벡터 있는 콘텐츠만" 넣는다. 둘이 같은 파일을 봐야 한다.
        # classpath: 또는 file: 형식. 운영에서는 jar에 싣지 않고 file:로 외부 경로를 넘긴다.
        files:
          book: classpath:data/book_vectors.csv
          movie: classpath:data/movie_vectors.csv
          music: classpath:data/music_vectors.csv
  server:
    # AI 서버(Tailscale IP). 배포 위치가 정해지지 않아 환경 변수로 바꿀 수 있게 둔다. 로컬 단독 테스트 시 http://localhost:8000
    base-url: ${AI_SERVER_BASE_URL:http://100.77.133.40:8000}
    # 묶음 임베딩 계약: {"query": ["...", ...]} -> {"vectors": [[...], ...], "model_version": "..."} (순서 그대로)
    embedding-path: /api/v1/embeddings
    # 연결은 짧게 둔다. AI 서버가 꺼지면(2026-10-10 Tailscale 끊김) 빨리 실패해야 다른 요청이 밀리지 않는다.
    connect-timeout: 2000
    # 묶음 호출 하나의 상한. 꽉 찬 묶음(max-size 15)이 약 3초라, AI 서버가 평소보다 느려져도 버틸 만큼 둔다.
    # 사용자가 기다리는 상한은 아래 max-wait다.
    read-timeout: 5000
    embedding-dimension: 768   # AI 서버가 반환하는 벡터 차원 (float32 x 768). 콘텐츠 벡터 적재도 이 값으로 검증한다

  # 검색어 임베딩(검색 보드). 자세한 이유는 EmbeddingBatcher, EmbeddingCache 머리말.
  embedding:
    batch:
      # 첫 요청 뒤 이만큼 더 모아 한 번에 보낸다. 한가할 때는 요청 하나가 이만큼 늦게 나갈 뿐이다.
      window: 20ms
      # 한 번에 보내는 최대 수. 여러 단어로 된 한국어 문장은 번역 때문에 묶어도 검색어당 약 180~215ms가 들어
      # 처리량은 상한과 관계없이 초당 약 10개다. 상한은 묶음 하나의 시간(≈ 개수 × 약 200ms)만 정한다.
      # 50이면 꽉 찬 묶음이 약 9초라 읽기 타임아웃(5초)에 걸렸고, 15면 약 3초다. 2026-10-14 측정에서
      # 50 → 15로 낮추자 처리량은 그대로이고 502(읽기 타임아웃)가 65~95% 줄었다. 타임아웃을 늘리는 대신 상한을 낮춘다.
      max-size: 15
      # AI 서버로 동시에 보내는 묶음 수. 많이 보내면 AI 서버가 연결을 끊는다.
      max-concurrent-calls: 2
      # 받아 둘 요청 수(대기 + 처리 중). 넘치면 503. 검색 보드가 붙잡는 톰캣 스레드(기본 200개)의 상한이기도 하다.
      max-pending: 60
      # 한 요청이 기다리는 상한. 넘기면 503.
      max-wait: 8s
    # Redis(emb:v1:{검색어}). 키 1개 약 5.2KB라 메모리 ≈ TTL 동안의 서로 다른 검색어 수 × 5.2KB.
    # 검색어는 겹침이 적어 짧은 시간 안의 반복만 노린다. TTL이 길면 같은 Redis의 추천 캐시가 volatile-lru로 밀려날 수 있다.
    cache:
      enabled: true
      ttl: 1h

  # 사용자 취향 벡터. 좋아요한 보드들의 콘텐츠 벡터에서 매번 다시 계산한다.
  user-vector:
    # 최근 활동일에 얼마나 더 무게를 둘지. 좋아요한 "날짜"를 최신순으로 줄 세워
    # (1-alpha)^순위를 가중치로 준다. 같은 날 누른 것은 같은 가중치를 받으므로
    # 한 세션에 몰아 눌러도 앞의 것이 밀려나지 않는다.
    # 0.25면 최근 10번째 활동일의 가중치가 0.75^10 ≈ 0.075다.
    decay-alpha: 0.25
    # 동시에 도는 취향 벡터 재계산 수(UserVectorRecalculationQueue). 재계산은 좋아요한 보드 전부의 콘텐츠 벡터를
    # Qdrant에서 받아 와 Qdrant CPU를 많이 쓴다. 상한이 없으면 좋아요가 몰릴 때 추천이 쓸 Qdrant를 다 차지한다.
    # 같은 사용자의 재계산은 합쳐지므로 대기열은 사용자 수를 넘지 않는다.
    recalculation-concurrency: 2
    # 시작 벡터는 가입 직후 사용자가 고른 콘텐츠(1~10개)의 평균이다. 고른 id가 user_vector 행에 남아,
    # 좋아요 재계산에서 가장 오래된 좋아요 날짜 다음 순위의 한 표로 들어간다. 좋아요가 0개가 되면
    # 고른 콘텐츠만으로 다시 계산한다.

# ---------------------------------
# ✅ 이미지 저장소 — 로컬은 MinIO. 같은 S3Client로 부르고(S3Config), 운영(AWS S3) 값은 application-prod.yaml에 있다.
# ---------------------------------
storage:
  endpoint: http://localhost:9000   # MinIO 서버 주소. 비우면 리전의 AWS S3로 간다
  region: ap-northeast-2
  bucket-name: content-bucket   # 서버 안에 만든 특정 저장 공간 이름
  bucket-url: http://localhost:9000/content-bucket    # 브라우저가 이미지를 받는 기본 경로
  # MinIO 계정. 비우면 AWS 기본 자격 증명 체인(운영은 ECS 작업 역할)을 쓴다.
  access-key: ${STORAGE_ACCESS_KEY}
  secret-key: ${STORAGE_SECRET_KEY}


# ---------------------------------
  # ✅ 5. Elasticsearch (전문 검색 엔진)
# ---------------------------------
#  elasticsearch:
#    uris: http://localhost:9200
    # xpack 보안을 false로 했으므로 username/password 생략

# ---------------------------------
# 로깅 수준 설정
# ---------------------------------
jwt:
  secret: ${JWT_SECRET_KEY}
  expiry: 3600000   # 1시간 (ms)
  refresh-expiry: 1209600000  # 14일

app:
  oauth2:
    redirect-uri: https://localhost:3000/auth/callback  # Vite 개발 서버가 basic-ssl로 HTTPS만 서빙하므로 http로 두면 콜백이 끊긴다

# 시딩 중 원본 이미지 URL -> MinIO 업로드 설정.
# 전체 데이터는 book 12만 / movie 4만 / music 190만 건이라 다 받을 이유가 없다.
# API 테스트에 필요한 만큼만 올리고 나머지는 s3object_key NULL로 남긴다.
#
# 상한을 500에서 10000으로 올린 이유: 추천 보드가 Qdrant 벡터 유사도로 콘텐츠를 뽑는데,
# 이미지가 있는 콘텐츠가 1,373건뿐(전체의 0.7%)이라 추천 결과가 거의 다 포스터 없이 나왔다.
# (당시 시딩하던 PRE_MADE 보드는 s3object_key IS NOT NULL로 골라 담아서 이 문제가 드러나지 않았다.)
#
# 0으로 두면 업로드를 건너뛰고 시딩만 한다(코드 기본값도 0이다).
# 이미지 없이 빠르게 스키마·데이터만 확인하고 싶을 때 쓴다 — 대신 보드가 전부 포스터 없이 뜬다.
seed:
  image-upload:
    limit: 10000      # 타입당 업로드 상한
    concurrency: 30   # 동시 요청 수. 외부 이미지 서버 차단을 피하려면 과하게 올리지 말 것.
    request-timeout: 30s  # 한 건을 본문까지 다 받는 최대 시간. 느린 원본 서버(coverartarchive 등)는 늘려서 다시 돌린다

# 이미지가 없는 콘텐츠의 이미지를 원본 CSV URL에서 채우는 일회성 작업(ImageBackfillJob). 평소에는 꺼져 있다.
# 켜서 띄울 때는 웹 서버와 주기 작업도 끈다:
#   --job.image-backfill.enabled=true --spring.main.web-application-type=none --scheduler.enabled=false
# 운영은 ECS 일회성 작업으로 돌리고 CSV 위치를 s3://로 넘긴다(infra/terraform/scripts/run-image-backfill.sh).
job:
  image-backfill:
    enabled: false
    book: classpath:data/book.csv
    movie: classpath:data/movie.csv
    music: classpath:data/music.csv
    batch-size: 2000      # 묶음마다 DB에 반영한다. 끊겼을 때 다시 받는 양의 상한
    limit-per-type: 0     # 종류마다 처리할 상한. 0이면 전부(시험 삼아 적게 돌릴 때만 쓴다)
    types: book,movie,music  # 채울 종류. 일부만 다시 돌릴 때 줄인다
    report-location:      # 실패 목록 CSV(s3://버킷/키 또는 file:경로). 비우면 남기지 않는다

scheduler:
  # 주기 작업 전체. 일회성 작업으로 앱을 띄울 때만 끈다(SchedulingConfig).
  enabled: true
  refresh-token-cleanup:
    cron: "0 0 4 * * *"
  # 재계산이 유실된 취향 벡터를 뒤늦게 고치는 배치. 근거는 UserVectorBackfillService 주석 참고.
  #
  # grace: 방금 누른 좋아요는 아직 비동기 재계산이 도는 중일 수 있다. 그것까지 밀린 것으로 보면
  #        백필이 진행 중인 작업을 쫓아다니며 같은 계산을 두 번 한다. 재계산 실측이 수십~수백 ms라
  #        5분이면 넉넉하다.
  # batch-size: 크게 망가졌을 때 한 번 돌기 시작한 배치가 몇 시간을 붙잡지 않도록 상한을 둔다.
  #        못 고친 사람은 다음 주기가 이어받는다.
  #
  # stale.users 게이지도 이 주기로 갱신된다. 대상을 찾는 쿼리가 곧 그 게이지가 세려던 집합이라
  # 따로 세면 같은 스캔이 두 번 돈다. 게이지 신선도를 위해 10분이 아니라 5분으로 둔다.
  user-vector-backfill:
    fixed-delay: 5m
    initial-delay: 2m
    grace: 5m
    batch-size: 100

logging:
  level:
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

